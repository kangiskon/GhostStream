services:
  api:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ghoststream]
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ghoststream
      POSTGRES_USER: ghoststream
      POSTGRES_PASSWORD: change-me
    volumes:
      - ghoststream_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghoststream -d ghoststream"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ghoststream]
networks:
  ghoststream: {}
volumes:
  ghoststream_pg: {}
