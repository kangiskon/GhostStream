[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghoststream-api"
version = "2.0.0"
description = "GhostStream 2.0 account, device, sync, diagnostics, and deletion API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "argon2-cffi>=23,<26",
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ghoststream_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
